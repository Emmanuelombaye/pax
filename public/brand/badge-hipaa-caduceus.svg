<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" role="img" aria-labelledby="pax-hipaa-title">
  <title id="pax-hipaa-title">HIPAA Compliant</title>
  <!-- Caduceus: central staff -->
  <line x1="40" y1="14" x2="40" y2="68" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Wings: left -->
  <path d="M40 22 C32 16, 18 18, 16 26 C14 34, 26 34, 40 30" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M40 22 C34 17, 20 16, 18 22 C16 28, 28 28, 40 26" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="rgba(255,255,255,0.18)"/>
  <!-- Wings: right -->
  <path d="M40 22 C48 16, 62 18, 64 26 C66 34, 54 34, 40 30" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M40 22 C46 17, 60 16, 62 22 C64 28, 52 28, 40 26" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="rgba(255,255,255,0.18)"/>
  <!-- Snake left: wraps around staff -->
  <path d="M37 30 C30 34, 30 40, 37 44 C44 48, 44 54, 37 58 C33 61, 36 66, 40 68"
        stroke="#C8D8F0" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- Snake right: wraps around staff -->
  <path d="M43 30 C50 34, 50 40, 43 44 C36 48, 36 54, 43 58 C47 61, 44 66, 40 68"
        stroke="#C8D8F0" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- Snake heads -->
  <circle cx="37" cy="29" r="2.8" fill="#C8D8F0"/>
  <circle cx="43" cy="29" r="2.8" fill="#C8D8F0"/>
  <!-- Top orb / knob -->
  <circle cx="40" cy="13" r="3.5" fill="#FFFFFF"/>
</svg>
